<!DOCTYPE html>
<html>
	<head>
		<style>
			.Box{
				width:100px;
				height:100px;
				background-color:black;
				text-align:center;	
				color:white;
				font-size:32px;
				display:flex;
				justify-content:center;
				align-items:center;
			}
			.Container{
				display:grid;
				gap:1rem;
				grid-template-columns:repeat(3,100px);<!--33% 33% 33%// 100px 100px 100px -->
			}
		</style>
	</head>
	<body>
		<div class="Container">
			<div class="Box">1</div>
			<div class="Box">2</div>
			<div class="Box">3</div>
			<div class="Box">4</div>
			<div class="Box">5</div>
			<div class="Box">6</div>
			<div class="Box">7</div>
			<div class="Box">8</div>
			<div class="Box">9</div>
		</div>
	</body>
</html>
